name: lint
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check (bash -n)
        run: |
          set -e
          for f in $(git ls-files '*.sh') boot-guards/bin/esp-grub-stub-rebaseline extras/bin/luks-fetch-cache; do
            bash -n "$f"
            echo "syntax OK: $f"
          done

      - name: shellcheck (warning severity)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck -S warning \
            $(git ls-files '*.sh') \
            boot-guards/bin/esp-grub-stub-rebaseline \
            extras/bin/luks-fetch-cache

  uboot-efivar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python compiles
        run: python3 -m py_compile boot-guards/bin/uboot-efivar.py
      - name: U-Boot EFI variable file tool
        run: bash tests/uboot-efivar-test.sh

  loopback:
    # Real cryptsetup reencrypt + hard-kill/repair/resume against a throwaway
    # file-backed loop device — no real disk is ever touched or modified.
    #
    # aarch64 only. This is Apple Silicon tooling; x86_64 in-place encryption
    # is LinuxLocker's job (https://github.com/doug445/LinuxLocker) and is
    # tested there. The x86 leg also hung multi-install-selection-test.sh for
    # an hour on 2026-09-21 — unexplained, and the suite now carries a
    # watchdog so a repeat fails in five minutes instead of burning a runner.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: install cryptsetup + btrfs-progs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cryptsetup-bin btrfs-progs gdisk dosfstools
      - name: loopback core test
        run: sudo bash tests/loopback-core-test.sh
      - name: multi-install partition selection test
        # timeout, so a blocked helper fails the step in five minutes rather
        # than holding a runner for an hour, which it did once on x86.
        run: sudo timeout 300 bash tests/multi-install-selection-test.sh
